name: Blue Ruler Physical Asset Repair

on:
  push:
    branches:
      - fix/blue-ruler-valid-png-20260912
    paths:
      - ".github/workflows/blue-ruler-physical-repair.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inspect invalid physical file
        id: invalid
        shell: bash
        run: |
          set -euo pipefail
          FILE='Imagens Ilustrativa/school-object-blue-ruler-regua-azul.png'
          test "$(git hash-object "$FILE")" = "ed8b6c83f7417001584d2a8b5e0fc9ea50afcb93"
          echo "INVALID_FILE_DESCRIPTION=$(file -b "$FILE")"
          echo "INVALID_FILE_MIME=$(file -b --mime-type "$FILE")"
          echo -n "INVALID_MAGIC_BYTES="
          xxd -p -l 32 "$FILE" | tr -d '\n'
          echo
          if head -c 8 "$FILE" | cmp -s - <(printf '\x89PNG\r\n\x1a\n'); then
            echo "INVALID_PNG_SIGNATURE=UNEXPECTED_PASS"
            exit 1
          else
            echo "INVALID_PNG_SIGNATURE=FAIL_CONFIRMED"
          fi

      - name: Install independent decoder
        shell: bash
        run: python3 -m pip install --disable-pip-version-check --quiet pillow

      - name: Confirm invalid decoder failure and classify
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, UnidentifiedImageError
          p=Path('Imagens Ilustrativa/school-object-blue-ruler-regua-azul.png')
          data=p.read_bytes()
          sigs={
              b'\x89PNG\r\n\x1a\n':'PNG',
              b'\xff\xd8\xff':'JPEG',
              b'GIF87a':'GIF87a',
              b'GIF89a':'GIF89a',
              b'RIFF':'RIFF/possible-WEBP',
              b'<svg':'SVG',
              b'<?xml':'XML/SVG-possible',
              b'<html':'HTML',
              b'<!DOCTYPE':'HTML',
          }
          detected=None
          for magic,name in sigs.items():
              if data.startswith(magic):
                  detected=name
                  break
          try:
              im=Image.open(p)
              im.load()
          except Exception as e:
              print(f'INVALID_DECODER=FAIL_CONFIRMED ({type(e).__name__}: {e})')
              print('INVALID_FILE_ACTUAL_TYPE=' + (detected or 'OPAQUE_BINARY_DATA_UNRECOGNIZED'))
              print('REPAIR_STRATEGY=REGENERATE')
          else:
              raise SystemExit(f'Unexpectedly decodable image: format={im.format} size={im.size}')
          PY

      - name: Regenerate one semantic blue ruler
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFilter
          from pathlib import Path

          W=H=1254
          S=2
          cw=ch=W*S
          canvas=Image.new('RGBA',(cw,ch),(0,0,0,0))
          rw,rh=1900,260
          ruler=Image.new('RGBA',(rw+160,rh+160),(0,0,0,0))
          x0=y0=80
          x1,y1=x0+rw,y0+rh
          radius=42

          shadow=Image.new('RGBA',ruler.size,(0,0,0,0))
          sd=ImageDraw.Draw(shadow)
          sd.rounded_rectangle((x0+18,y0+26,x1+18,y1+26),radius=radius,fill=(0,60,120,80))
          shadow=shadow.filter(ImageFilter.GaussianBlur(18))
          ruler=Image.alpha_composite(ruler,shadow)

          body=Image.new('RGBA',ruler.size,(0,0,0,0))
          bd=ImageDraw.Draw(body)
          for i in range(rh):
              t=i/(rh-1)
              if t < 0.32:
                  k=t/0.32
                  c=(22,158+int(45*k),242+int(10*k),255)
              else:
                  k=(t-0.32)/0.68
                  c=(26-int(10*k),203-int(70*k),252-int(35*k),255)
              bd.line((x0,y0+i,x1,y0+i),fill=c,width=1)

          mask=Image.new('L',ruler.size,0)
          md=ImageDraw.Draw(mask)
          md.rounded_rectangle((x0,y0,x1,y1),radius=radius,fill=255)
          clipped=Image.new('RGBA',ruler.size,(0,0,0,0))
          clipped.paste(body,(0,0),mask)
          ruler=Image.alpha_composite(ruler,clipped)
          d=ImageDraw.Draw(ruler)
          d.rounded_rectangle((x0,y0,x1,y1),radius=radius,outline=(0,100,220,255),width=12)
          d.rounded_rectangle((x0+8,y0+8,x1-8,y1-8),radius=radius-8,outline=(110,225,255,180),width=6)
          d.rounded_rectangle((x0+44,y0+34,x1-44,y0+88),radius=24,fill=(255,255,255,38))

          cx,cy=x0+120,y0+rh//2
          alpha=ruler.getchannel('A')
          ad=ImageDraw.Draw(alpha)
          ad.ellipse((cx-24,cy-24,cx+24,cy+24),fill=0)
          ruler.putalpha(alpha)
          d=ImageDraw.Draw(ruler)
          d.ellipse((cx-38,cy-38,cx+38,cy+38),outline=(2,80,175,255),width=12)
          d.ellipse((cx-31,cy-31,cx+31,cy+31),outline=(110,230,255,220),width=5)

          # Measurement ticks only. No letters, numerals, labels, watermark, or answer text.
          start=x0+190
          end=x1-80
          top=y0+12
          span=end-start
          for i in range(81):
              x=start+span*i/80
              if i % 10 == 0:
                  length,width=80,8
              elif i % 5 == 0:
                  length,width=58,6
              else:
                  length,width=34,4
              d.line((x,top+4,x,top+length),fill=(4,42,92,225),width=width)
          d.line((start,top+5,end,top+5),fill=(6,56,118,190),width=5)

          rot=ruler.rotate(-34,resample=Image.Resampling.BICUBIC,expand=True)
          rot=rot.crop(rot.getbbox())
          maxdim=int(cw*0.92)
          ratio=min(maxdim/rot.width,maxdim/rot.height)
          rot=rot.resize((int(rot.width*ratio),int(rot.height*ratio)),Image.Resampling.LANCZOS)
          canvas.alpha_composite(rot,((cw-rot.width)//2,(ch-rot.height)//2))
          final=canvas.resize((W,H),Image.Resampling.LANCZOS)
          final=final.quantize(colors=24,method=Image.Quantize.FASTOCTREE,dither=Image.Dither.NONE)
          out=Path('Imagens Ilustrativa/school-object-blue-ruler-regua-azul.png')
          final.save(out,'PNG',optimize=True)
          print(f'REGENERATED={out} bytes={out.stat().st_size}')
          PY

      - name: Physical PNG gate with independent checks
        shell: bash
        run: |
          set -euo pipefail
          FILE='Imagens Ilustrativa/school-object-blue-ruler-regua-azul.png'
          NEW_BLOB="$(git hash-object "$FILE")"
          test "$NEW_BLOB" != "ed8b6c83f7417001584d2a8b5e0fc9ea50afcb93"
          echo "NEW_VALID_BLOB=$NEW_BLOB"
          file "$FILE"
          identify "$FILE"
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          p=Path('Imagens Ilustrativa/school-object-blue-ruler-regua-azul.png')
          data=p.read_bytes()
          assert len(data) > 0
          assert data[:8] == b'\x89PNG\r\n\x1a\n'
          assert data[12:16] == b'IHDR'
          im=Image.open(p)
          im.verify()
          im=Image.open(p)
          im.load()
          w,h=im.size
          assert w >= 1024 and h >= 1024
          assert (w,h) == (1254,1254)
          rgba=im.convert('RGBA')
          pixels=list(rgba.getdata())
          non=[px for px in pixels if px[3] > 16]
          assert non, 'all transparent'
          non_ratio=len(non)/len(pixels)
          assert 0.05 < non_ratio < 0.80, non_ratio
          unique=len(set(non))
          assert unique > 8, unique
          blue=sum(1 for r,g,b,a in non if b > r*1.3 and b > g*1.05)/len(non)
          assert blue > 0.70, blue
          print('PNG_SIGNATURE=PASS')
          print('IHDR=PASS')
          print('DECODE=PASS')
          print(f'WIDTH={w}')
          print(f'HEIGHT={h}')
          print(f'FILE_SIZE={len(data)}')
          print(f'NONTRANSPARENT_RATIO={non_ratio:.4f}')
          print(f'UNIQUE_RGBA={unique}')
          print(f'BLUE_DOMINANT_RATIO={blue:.4f}')
          print('SEMANTIC_VISUAL=BLUE_RULER_PASS')
          print('HIGH_RES=PASS')
          PY

      - name: Commit only repaired physical asset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "duduq-asset-repair-bot"
          git config user.email "duduq-asset-repair-bot@users.noreply.github.com"
          git rm --quiet .github/workflows/blue-ruler-physical-repair.yml
          git add 'Imagens Ilustrativa/school-object-blue-ruler-regua-azul.png'
          python3 - <<'PY'
          import subprocess
          base='a3077d11fba4140682c557077bd5394178214963'
          names=subprocess.check_output(['git','diff','--name-status',base,'--'],text=True).splitlines()
          expected=['M\tImagens Ilustrativa/school-object-blue-ruler-regua-azul.png']
          if names != expected:
              raise SystemExit(f'Unexpected final repair delta: {names}')
          print('REPAIR_DELTA_GATE=PASS')
          PY
          git commit -m "fix(assets): replace invalid blue ruler PNG"
          echo "VALID_BLUE_RULER_SHA=$(git rev-parse HEAD)"
          echo "VALID_BLUE_RULER_BLOB=$(git hash-object 'Imagens Ilustrativa/school-object-blue-ruler-regua-azul.png')"
          git push

      - name: Upload repaired visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: blue-ruler-valid-png
          path: Imagens Ilustrativa/school-object-blue-ruler-regua-azul.png
          if-no-files-found: error
